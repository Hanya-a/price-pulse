<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Price Pulse – Product List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Import homepage CSS specifically for the root variables, global layout resets, and floating coin animations -->
    <link rel="stylesheet" href="../homepage/homepage.css">
    <link rel="stylesheet" href="../productlist/productlist.css">
</head>
<body>

    <!-- HEADER / NAVBAR exactly like admin -->
    <header>
      <div style="position: relative; display: flex; align-items: center; gap: 15px;">
        <a href="../homepage/homepage.html" style="color:var(--accent); font-weight:800; font-size:1.6rem; display:flex; align-items:center;">
            Price-Pulse
        </a>

        <!-- Hamburger menu that reveals the navigation options -->
        <button class="menu-toggle" onclick="document.getElementById('productlistDropdown').style.display = document.getElementById('productlistDropdown').style.display === 'block' ? 'none' : 'block'">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- The Menu dropdown containing Home and Contact -->
        <div id="productlistDropdown" style="display:none; position:absolute; top:45px; left:0; background:white; padding:15px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); z-index:100; min-width: 180px;">
           <a href="../homepage/homepage.html?menu=1" style="display:block; margin-bottom:10px; font-weight:600; color:#1e1b4b;">Home</a>
           <a href="../trending/trending.html" style="display:block; margin-bottom:10px; font-weight:600; color:#1e1b4b;">Trending</a>
           <a href="../contact/contact1.0.html" style="display:block; font-weight:600; color:#1e1b4b;">Contact</a>
           <hr style="border:none; border-top:1px solid #f1f5f9; margin: 10px 0;">
           <a href="../auth/login.html" onclick="if(confirm('Are you sure you want to log out?')){localStorage.removeItem('loggedInUser');return true;}return false;" style="display:block; font-weight:600; color:#e11d48;">Log out</a>
        </div>
      </div>

      <nav style="display:flex; justify-content:center; flex:1;">
        <!-- Exact Same Search Bar from Homepage injected here -->
        <form onsubmit="executeSearch(); return false;" style="margin: 0; width: min(500px, 100%); padding: 8px 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06);">
          <input type="search" id="productlistSearchInput" placeholder="Search for products..." style="padding: 6px 10px;">
          <button type="button" onclick="executeSearch()" style="padding: 8px 20px;">Search</button>
        </form>
      </nav>

      <div>
        <div class="profile-icon" style="cursor:pointer; background: var(--accent); color: var(--white); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);" onclick="window.location.href='../profile/profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
      </div>
    </header>

    <main>
        <!-- FIRST SECTION: This will magically inherit the floating coin background from homepage.css! -->
        <section class="products-grid-section">
            <h2 id="page-title" style="color: white; text-align: center; margin-bottom: 2rem; font-size: 2rem; font-weight: 800;">All Products</h2>
            <div class="products-grid" id="productGridContainer">
                <!-- Cards will be populated dynamically from localStorage via productlist.js -->
            </div>

        </section>
    </main>

    <script src="productlist.js"></script>
</body>
</html>
