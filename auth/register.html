<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price-Pulse – Create new Account</title>
    <link rel="stylesheet" href="../homepage/homepage.css" />
    <link rel="stylesheet" href="../auth/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- HEADER / NAVBAR -->
    <header>
      <div>
        <a href="../homepage/homepage.html">Price-Pulse</a>
      </div>

      <nav>
        <a href="../homepage/homepage.html">Home</a>
        <a href="../homepage/homepage.html#categories">Categories</a>
        <a href="../trending/trending.html">Trending</a>
        <a href="../contact/contact1.0.html">Contact</a>
      </nav>

      <div>
        <a href="../auth/login.html">Login</a>
        <a href="../auth/register.html">Register</a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="form-wrapper">
      <div class="form-container">
        <h1>Create new Account</h1>
        <p class="switch-page-top">
          Already Registered? <a href="../auth/login.html">Login</a>
        </p>

        <form id="registerform" action="#" method="POST">
          <div class="input-group">
            <label for="name">NAME</label>
            <input type="text" id="name" name="name" placeholder="Jiara Martins" required />
          </div>
          <div class="input-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" placeholder="hello@reallygreatsite.com" required />
          </div>
          <div class="input-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" placeholder="******" required />
          </div>
          <div class="input-group">
            <label for="city">PREFERRED CITY</label>
            <div class="select-wrapper">
              <select id="city" name="city" required>
                <option value="" disabled selected>Select</option>
                <option value="cairo">Cairo</option>
                <option value="alexandria">Alexandria</option>
                <option value="giza">Giza</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <button type="submit" class="submit-btn mt-4">sign up</button>
        </form>
        <div id="message" style="margin-top: 1rem; font-size: 14px; min-height: 1.5em; text-align: center;"></div>
      </div>
    </main>
    <script src="register.js"></script>
  </body>
</html>
